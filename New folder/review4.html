<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<style>
	.box{
		width: 300px;
		margin: 100px auto;
		padding: 20px;

		border: 1px solid #ccc;
		border-radius: 8px;

		font-family: "Segoe UI", sans-serif;
	}

	.box label{
		display: block;
		margin-bottom: 5px;
	}

	.box input{
		width: 93%;
		padding: 8px;
		margin-bottom: 15px;
	}

	.box button{
		width: 100%;
		padding: 8px;
		background-color: #3b5bfd;
		border: none;
		color: white;
		transition: 0.2s ease;
	}

	.box button:hover{
		background-color: #2a45d1;
	}

	a{
		color: blue;
	}

	#msg{
		margin-bottom: 15px;
	}


</style>
<body>
	<div class="box">
	<h2>Change password</h2>
	<label for="email">Email</label>
	<input type="email" id="email" name="email">

	<label for="changepass">New password</label>
	<input type="password" id="newpass" name="changepass">

	<label for="confirmpass">Confirm password</label>
	<input type="password" id="confirmpass" name="confirmpass">

	<button id="proceed">Proceed</button>

	<p id="msg"></p>

	<a href="review.html" id="back"></a>
</body>

<script>
	var emailINput = document.getElementById('email');
	var newPassInput = document.getElementById('newpass');
	var confirmPassInput = document.getElementById('confirmpass');
	var msg = document.getElementById('msg');
	var backBtn = document.getElementById('back');
	var btn = document.getElementById('proceed');

	btn.addEventListener('click', function proceed(){
		var email = emailINput.value;
		var newPass = newPassInput;
		var confirmPass = confirmPassInput;

		if (email != "walangkaninbuseng@gmail.com" && newPass != confirmPass) {
			msg.textContent = "Invalid email or password does not match";
		}else{
			msg.textContent = "Password changed!";
			backBtn.textContent = "Return to log in";
		}

		emailINput.value = "";
		newPassInput.value = "";
		confirmPassInput.value = "";

	});

</script>
</html>
